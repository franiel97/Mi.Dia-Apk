name: Build Android
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "versionCode (sobe a cada envio para a Play Store)"
        default: "1"
  push:
    branches: [main]
jobs:
  android:
    runs-on: ubuntu-latest
    env:
      MIDIA_VERSION_CODE: ${{ github.event.inputs.version_code || github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - run: npm install
      - run: npx cap sync android
      - name: Restaurar keystore (se configurada)
        env:
          KS_B64: ${{ secrets.MIDIA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/midia.jks"
            echo "MIDIA_KEYSTORE_PATH=$RUNNER_TEMP/midia.jks" >> $GITHUB_ENV
          fi
      - name: Build debug APK (teste)
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Build AAB + APK release (Play Store)
        if: ${{ env.MIDIA_KEYSTORE_PATH != '' }}
        env:
          MIDIA_KEYSTORE_PASSWORD: ${{ secrets.MIDIA_KEYSTORE_PASSWORD }}
          MIDIA_KEY_ALIAS: ${{ secrets.MIDIA_KEY_ALIAS }}
          MIDIA_KEY_PASSWORD: ${{ secrets.MIDIA_KEY_PASSWORD }}
        run: cd android && ./gradlew bundleRelease assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: mi-dia-android
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: ignore
